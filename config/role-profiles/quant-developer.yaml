# ILLUSTRATIVE EXAMPLE — not anyone's verified qualifications. Copy and tune per user.
schemaVersion: 1
kind: RoleProfile
key: quant-developer
displayName: Quant Developer
jobFamily: quant-developer
example: true
titles:
  include: [quant developer, quantitative developer, quantitative software engineer, trading systems engineer, algorithmic trading developer]
  exclude: [intern, sales, trader]
  seniority: [ENTRY, MID, SENIOR]
searchTerms: [quant, c++, low latency, trading systems]
skills:
  required: [cpp]
  requiredAnyOf:
    - [python, java]
  preferred:
    - { skill: probability, weight: 2 }
    - { skill: statistics, weight: 2 }
    - { skill: algorithms, weight: 2 }
    - { skill: low-latency, weight: 2 }
    - { skill: linux }
experience: { minYears: 1, maxYears: 10 }
education:
  fields: [computer science, mathematics, physics, statistics, engineering]
  minimumLevel: BACHELOR
locations:
  workplaceTypes: [HYBRID, ONSITE]
employmentTypes: [FULL_TIME]
eligibility:
  - type: title-match
  - type: employment-type-in
  - type: education-level-min       # UNKNOWN (never FAIL) when education facts are missing
    params: { level: BACHELOR }
  - type: work-authorization
    params: { source: job-location }
scoring:
  strategy: weighted
  strategyVersion: 1
  weights: { title: 0.15, required-skills: 0.35, preferred-skills: 0.25, experience: 0.10, location: 0.15 }
  thresholds: { minimum: 55, shortlist: 75 }
documents:
  resumeTemplate: one-page-technical
  coverNote: { strategy: none }
screeningQuestions:
  - { match: "(?i)sponsor|visa|work authori[sz]ation", policy: ALWAYS_ASK_USER }
  - { match: "(?i)salary|compensation", policy: ALWAYS_ASK_USER }
