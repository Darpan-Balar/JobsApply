# Local PostgreSQL. Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432.
# Usage: cp .env.example .env  (set a password), then: docker compose up -d
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: jobs
      POSTGRES_USER: ${JOBS_DB_USER:-jobs}
      POSTGRES_PASSWORD: ${JOBS_DB_PASSWORD:?Set JOBS_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - jobs-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d jobs"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  jobs-postgres:
