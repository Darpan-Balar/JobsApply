# Shared defaults. Secrets come from the environment or a git-ignored .env file in the working directory.
spring:
  application:
    name: jobs-platform
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${JOBS_DB_URL:jdbc:postgresql://localhost:5433/jobs}
    username: ${JOBS_DB_USER:jobs}
    password: ${JOBS_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000   # ms (Hikari binds a plain number)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only verifies the mapping
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s   # let running requests and event deliveries finish on shutdown
  modulith:
    events:
      # Event publication registry (ADR-0014): Flyway owns the table (V14); unfinished deliveries are retried on restart.
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true

server:
  address: 127.0.0.1              # local-first: not reachable from the network by default
  port: ${JOBS_PORT:8090}         # override with JOBS_PORT
  shutdown: graceful
  servlet:
    session:
      timeout: 4h                 # idle timeout of a signed-in session
      cookie:
        name: JOBS_SESSION
        http-only: true
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics   # metrics: administrators only
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized   # administrators only (ADR-0014)
      show-components: when-authorized
      roles: ADMIN
      status:
        order: DOWN, OUT_OF_SERVICE, WARNING, UNKNOWN, UP
        http-mapping:
          WARNING: 200

logging:
  structured:
    format:
      console: ecs
    json:
      customizer: com.jobsapply.platform.shared.web.RedactingLogCustomizer

springdoc:
  api-docs:
    path: /v3/api-docs

jobs:
  crypto:
    key: ${JOBS_ENCRYPTION_KEY:}
    key-id: k1
  storage:
    directory: data          # encrypted personal files; git-ignored
  identity:
    legacy-username: local   # the pre-login account; first-account setup takes it over (keeps its data)
    max-failed-logins: 5
    lockout: 15m
  llm:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}   # optional; set it in .env to offer "Use Claude" when reading a resume
      model: claude-opus-5-5
      effort: low
  operations:
    sync:
      enabled: true
      cron: "0 0 6,12,18 * * *"      # every active employer binding, three times a day
    retention:
      enabled: true
      cron: "0 30 3 * * *"
      sync-runs: 90d
      event-publications: 7d
  config:
    directory: config
    import-on-startup: false
    validate-only: false
  browser:
    headless: false          # the human must see the window and press Submit
    # channel: chrome        # use an installed Chrome instead of Playwright's own build (no download)
  assist:
    adapter: playwright-browser
    max-observe: 120s
