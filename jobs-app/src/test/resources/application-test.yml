logging:
  structured:
    format:
      console: ""      # plain text in tests
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
jobs:
  config:
    import-on-startup: false
  crypto:
    # Fixed key for tests only (base64 of 32 bytes); never used outside tests.
    key: dGVzdC1rZXktZm9yLXRlc3RzLW9ubHktMzItYnl0ZXM=
  storage:
    directory: target/test-data   # test files are removed by mvn clean
