<!doctype html>
<html><head><title>Apply: Senior Backend Engineer</title></head>
<body>
<form method="post" action="/submit">
  <label for="first_name">First Name *</label><input id="first_name" name="first_name" required>
  <label for="last_name">Last Name *</label><input id="last_name" name="last_name" required>
  <label for="email">Email *</label><input id="email" name="email" type="email" required>
  <label for="phone">Phone</label><input id="phone" name="phone" type="tel">
  <label for="resume">Resume/CV *</label><input id="resume" name="resume" type="file" required>
  <fieldset><legend>Will you now or in the future require visa sponsorship? *</legend>
    <label><input type="radio" name="question_11" value="1" required> Yes</label>
    <label><input type="radio" name="question_11" value="0"> No</label>
  </fieldset>
  <label for="question_12">How many years of professional experience do you have? *</label><input id="question_12" name="question_12" required>
  <label for="gender">Gender</label><select id="gender" name="gender"><option value="">Select</option><option>Female</option><option>Male</option><option>Decline to self-identify</option></select>
  <label><input type="checkbox" id="consent" name="consent" required> I agree to the privacy policy *</label>
  <button type="submit">Submit application</button>
</form>
</body></html>
